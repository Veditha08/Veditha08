<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 210" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0.3; }
      }
      .pulse-beacon {
        animation: blink 1.8s infinite;
      }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="0.5" y="0.5" width="799" height="209" rx="8" fill="#0D1117" stroke="#30363D" stroke-width="1"/>

  <!-- Terminal Title Bar -->
  <path d="M 0.5 8.5 A 8 8 0 0 1 8.5 0.5 L 791.5 0.5 A 8 8 0 0 1 799.5 8.5 L 799.5 28.5 L 0.5 28.5 Z" fill="#161B22"/>
  <line x1="0" y1="28.5" x2="800" y2="28.5" stroke="#30363D" stroke-width="1"/>

  <!-- Title & Beacon -->
  <circle cx="18" cy="14" r="3.5" fill="#FBBF24" class="pulse-beacon"/>
  <text x="30" y="18" fill="#FBBF24" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" letter-spacing="0.5">
    ⚡ LIVE OPEN-SOURCE TELEMETRY // LATEST MERGED PRs
  </text>

  <!-- Window Controls -->
  <g transform="translate(736, 9)" fill="none" stroke="#8B949E" stroke-width="1.2">
