<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Dark radial center spotlight -->
    <radialGradient id="centerSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="60%" stop-color="#11161d"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </radialGradient>

    <!-- Subtle warm amber ambient glow behind text (6% opacity) -->
    <radialGradient id="warmGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.06"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. Background Canvas -->
  <rect width="1200" height="150" fill="#0D1117"/>
  <rect width="1200" height="150" fill="url(#centerSpot)"/>
  <rect width="1200" height="150" fill="url(#warmGlow)"/>

  <!-- 2. Main Title (Centered at y=72) -->
  <text x="600" y="72" text-anchor="middle" fill="#F0F6FC" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="-0.5px">
    Veditha Keerti Rani
  </text>

  <!-- 3. Subtitle (Centered at y=108 with / separators in #F59E0B) -->
  <text x="600" y="108" text-anchor="middle" fill="#8B949E" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="0.2px">
    Full-Stack <tspan fill="#F59E0B"> / </tspan> Backend Systems <tspan fill="#F59E0B"> / </tspan> Open Source
  </text>
</svg>
