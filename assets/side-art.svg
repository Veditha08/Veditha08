<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <!-- Sky Glow in pure amber -->
    <radialGradient id="skyGlow" cx="72%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>

    <!-- Mini Eclipse Ring Gradient -->
    <linearGradient id="miniRingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#FBBF24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Card Clip -->
    <clipPath id="cardClip">
      <rect x="0" y="0" width="320" height="320" rx="8"/>
    </clipPath>

    <!-- Dither Pattern in #30363D -->
    <pattern id="ditherGrid" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="1" fill="#30363D" opacity="0.35"/>
      <rect x="2" y="2" width="1" height="1" fill="#30363D" opacity="0.35"/>
    </pattern>

    <style>
      @keyframes starPulse1 {
        0%, 100% { opacity: 0.25; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      @keyframes starPulse2 {
        0%, 100% { opacity: 0.85; transform: scale(1.1); }
        50% { opacity: 0.2; transform: scale(0.8); }
      }
      @keyframes starPulse3 {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      .star { transform-box: fill-box; transform-origin: center; }
      .s1 { animation: starPulse1 2.5s ease-in-out infinite; }
      .s2 { animation: starPulse2 3.2s ease-in-out infinite 0.6s; }
      .s3 { animation: starPulse3 3.8s ease-in-out infinite 1.2s; }

      @keyframes cosmicRingPulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 1px #FBBF24); }
        50% { transform: scale(1.06); filter: drop-shadow(0 0 5px #F59E0B); }
      }
      .cosmic-ring {
        transform-box: fill-box;
        transform-origin: center;
        animation: cosmicRingPulse 4s ease-in-out infinite;
      }

      @keyframes flowerPulse {
        0%, 100% { filter: drop-shadow(0 0 2px #F59E0B); }
        50% { filter: drop-shadow(0 0 7px #FBBF24); }
      }
      .flower-glow {
        animation: flowerPulse 3.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Card Body -->
  <g clip-path="url(#cardClip)">
    <!-- Base Background: #050505 pitch black -->
    <rect width="320" height="320" fill="#050505"/>

    <!-- Subtle Dither Pattern across upper sky -->
    <rect y="24" width="320" height="180" fill="url(#ditherGrid)"/>

    <!-- Ambient Sky Glow -->
    <circle cx="230" cy="200" r="110" fill="url(#skyGlow)"/>

    <!-- Window Title Bar -->
    <rect x="0" y="0" width="320" height="24" fill="#161B22"/>
    <line x1="0" y1="24" x2="320" y2="24" stroke="#30363D" stroke-width="1"/>
    <!-- Status dots in amber/yellow -->
    <circle cx="16" cy="12" r="3" fill="#30363D"/>
    <circle cx="26" cy="12" r="3" fill="#30363D"/>
    <circle cx="36" cy="12" r="3" fill="#FBBF24" opacity="0.8"/>
    <text x="50" y="16" fill="#F59E0B" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1">waypoint // trekker-sunflower</text>

    <!-- Distant Cosmic Crescent / Eclipse in sky (Pulsing) -->
    <g transform="translate(230, 72)" class="cosmic-ring">
      <circle cx="0" cy="0" r="14" fill="#050505" stroke="#F59E0B" stroke-width="0.8"/>
      <ellipse cx="0" cy="0" rx="30" ry="2.5" fill="none" stroke="url(#miniRingGrad)" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="14.5" fill="none" stroke="#FBBF24" stroke-width="0.6" opacity="0.9"/>
    </g>

    <!-- Starry Sky with Twinkling Animation -->
    <g id="stars">
      <rect x="40" y="55" width="2" height="2" fill="#F0F6FC" class="star s1"/>
      <g transform="translate(75, 80)" class="star s2">
        <rect x="1" y="0" width="1" height="3" fill="#FBBF24"/>
        <rect x="0" y="1" width="3" height="1" fill="#FBBF24"/>
      </g>
      <rect x="120" y="48" width="2" height="2" fill="#F59E0B" class="star s3"/>
      <rect x="165" y="70" width="2" height="2" fill="#F0F6FC" class="star s1"/>
      <g transform="translate(210, 42)" class="star s2">
        <rect x="1" y="0" width="1" height="3" fill="#FBBF24"/>
        <rect x="0" y="1" width="3" height="1" fill="#FBBF24"/>
      </g>
      <rect x="260" y="65" width="2" height="2" fill="#F59E0B" class="star s3"/>
      <rect x="290" y="95" width="2" height="2" fill="#F0F6FC" class="star s1"/>
      <rect x="50" y="130" width="1.5" height="1.5" fill="#F59E0B" class="star s2"/>
      <rect x="95" y="115" width="2" height="2" fill="#F0F6FC" class="star s3"/>
      <rect x="140" y="100" width="2" height="2" fill="#FBBF24" class="star s1"/>
      <rect x="280" y="140" width="2" height="2" fill="#F59E0B" class="star s2"/>
      <rect x="180" y="130" width="1.5" height="1.5" fill="#F0F6FC" class="star s3"/>
      <rect x="235" y="110" width="2" height="2" fill="#FBBF24" class="star s1"/>
    </g>

    <!-- Background Mountain Ridge -->
    <polygon points="
      0,225
      50,210
      105,195
      140,205
      190,188
      240,202
      285,190
      320,198
      320,320
      0,320
    " fill="#0D1117"/>
    <polyline points="
      0,225
      50,210
      105,195
      140,205
      190,188
      240,202
      285,190
      320,198
    " fill="none" stroke="#161B22" stroke-width="1"/>

    <!-- Foreground Terrain Ridge with Dithered Crest -->
    <polygon points="
      0,250
      40,246
      90,238
      135,232
      180,235
      230,228
      275,234
      320,230
      320,320
      0,320
    " fill="#161B22"/>
    <polyline points="
      0,250
      40,246
      90,238
      135,232
      180,235
      230,228
      275,234
      320,230
    " fill="none" stroke="#30363D" stroke-width="1.2"/>

    <!-- Pixel Dither Shading on ground -->
    <g fill="#050505" opacity="0.7">
      <rect x="0" y="270" width="320" height="50"/>
      <rect x="10" y="255" width="2" height="2"/>
      <rect x="30" y="258" width="2" height="2"/>
      <rect x="65" y="252" width="2" height="2"/>
      <rect x="110" y="256" width="2" height="2"/>
      <rect x="150" y="250" width="2" height="2"/>
      <rect x="195" y="255" width="2" height="2"/>
      <rect x="250" y="248" width="2" height="2"/>
      <rect x="290" y="252" width="2" height="2"/>
    </g>

    <!-- 1. Pixel Astronaut / Trekker Silhouette (Facing Right) -->
    <g id="pixel-trekker" transform="translate(90, 168)">
      <!-- Antenna / Beacon -->
      <rect x="13" y="0" width="2" height="4" fill="#30363D"/>
      <rect x="12" y="0" width="4" height="2" fill="#FBBF24"/>

      <!-- Helmet -->
      <rect x="8" y="4" width="12" height="12" rx="2" fill="#30363D"/>
      <!-- Visor (Glowing Amber reflection) -->
      <rect x="14" y="6" width="6" height="6" rx="1" fill="#F59E0B"/>
      <rect x="16" y="7" width="3" height="3" fill="#FBBF24"/>
      <rect x="18" y="7" width="1" height="1" fill="#F0F6FC"/>

      <!-- Trekker Backpack -->
      <rect x="2" y="16" width="7" height="18" rx="1" fill="#0D1117"/>
      <rect x="4" y="19" width="3" height="4" fill="#30363D"/>
      <rect x="4" y="26" width="3" height="3" fill="#F59E0B" opacity="0.9"/>

      <!-- Torso / Suit -->
      <rect x="9" y="16" width="11" height="20" fill="#0D1117"/>
      <rect x="12" y="18" width="7" height="8" fill="#161B22"/>
      <rect x="14" y="20" width="2" height="2" fill="#FBBF24"/>

      <!-- Arms -->
      <rect x="19" y="18" width="4" height="14" fill="#161B22"/>
      <rect x="20" y="32" width="3" height="3" fill="#30363D"/>
      <rect x="7" y="18" width="3" height="12" fill="#050505"/>

      <!-- Trekking Pole -->
      <line x1="22" y1="28" x2="25" y2="65" stroke="#30363D" stroke-width="1"/>
      <line x1="20" y1="28" x2="24" y2="28" stroke="#F59E0B" stroke-width="1.5"/>

      <!-- Legs -->
      <rect x="9" y="36" width="5" height="18" fill="#0D1117"/>
      <rect x="8" y="54" width="6" height="8" fill="#050505"/>
      <rect x="7" y="62" width="8" height="3" fill="#30363D"/>

      <rect x="15" y="36" width="5" height="18" fill="#161B22"/>
      <rect x="15" y="54" width="6" height="8" fill="#0D1117"/>
      <rect x="15" y="62" width="8" height="3" fill="#30363D"/>
    </g>

    <!-- 2. Pixel Sunflower (Pulsing Flower Glow) -->
    <g id="pixel-sunflower" transform="translate(216, 160) scale(1.8)" class="flower-glow">
      <!-- Soft Amber Bloom -->
      <circle cx="10" cy="10" r="16" fill="#FBBF24" opacity="0.2"/>

      <!-- Roots -->
      <rect x="7" y="36" width="6" height="2" fill="#0D1117"/>

      <!-- Stem -->
      <rect x="9" y="16" width="2" height="21" fill="#78350F"/>

      <!-- Leaves -->
      <rect x="4" y="24" width="5" height="3" rx="1" fill="#B45309"/>
      <rect x="3" y="25" width="2" height="2" fill="#78350F"/>
      <rect x="11" y="20" width="5" height="3" rx="1" fill="#B45309"/>
      <rect x="15" y="21" width="2" height="2" fill="#78350F"/>

      <!-- Petal Ring -->
      <rect x="8" y="2" width="4" height="4" fill="#FBBF24"/>
      <rect x="8" y="14" width="4" height="4" fill="#FBBF24"/>
      <rect x="2" y="8" width="4" height="4" fill="#FBBF24"/>
      <rect x="14" y="8" width="4" height="4" fill="#FBBF24"/>

      <!-- Diagonals -->
      <rect x="4" y="4" width="4" height="4" fill="#F59E0B"/>
      <rect x="12" y="4" width="4" height="4" fill="#F59E0B"/>
      <rect x="4" y="12" width="4" height="4" fill="#F59E0B"/>
      <rect x="12" y="12" width="4" height="4" fill="#F59E0B"/>

      <!-- Inner Corona -->
      <rect x="7" y="5" width="6" height="2" fill="#FBBF24"/>
      <rect x="7" y="13" width="6" height="2" fill="#FBBF24"/>
      <rect x="5" y="7" width="2" height="6" fill="#FBBF24"/>
      <rect x="13" y="7" width="2" height="6" fill="#FBBF24"/>

      <!-- Disc Core -->
      <rect x="7" y="7" width="6" height="6" fill="#050505"/>
      <rect x="8" y="8" width="4" height="4" fill="#78350F"/>
      <rect x="9" y="9" width="2" height="2" fill="#FBBF24"/>
    </g>

    <!-- Floating Pollen Embers -->
    <g id="pollen">
      <circle cx="195" cy="185" r="1.5" fill="#FBBF24" opacity="0.8"/>
      <circle cx="180" cy="198" r="1.2" fill="#F59E0B" opacity="0.6"/>
      <circle cx="215" cy="170" r="1.5" fill="#FBBF24" opacity="0.9"/>
      <circle cx="165" cy="175" r="1" fill="#FBBF24" opacity="0.7"/>
      <circle cx="205" cy="155" r="1.2" fill="#F59E0B" opacity="0.5"/>
      <circle cx="228" cy="188" r="1.4" fill="#FBBF24" opacity="0.75"/>
    </g>

    <!-- Bottom Caption -->
    <text x="160" y="306" text-anchor="middle" fill="#F59E0B" font-family="ui-monospace, Consolas, monospace" font-size="9" letter-spacing="1.5">TREK // ORBIT // GROW</text>
  </g>

  <!-- Outer Border -->
  <rect x="0.5" y="0.5" width="319" height="319" rx="8" fill="none" stroke="#30363D" stroke-width="1"/>
</svg>