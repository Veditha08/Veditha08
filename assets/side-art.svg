<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <!-- Card Rounded Clip -->
    <clipPath id="cardClip">
      <rect width="220" height="220" rx="18" ry="18"/>
    </clipPath>

    <!-- Ambient Sky Glow -->
    <radialGradient id="sideSkyGlow" cx="72%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0A0D12" stop-opacity="0"/>
    </radialGradient>

    <!-- Mini Eclipse Ring Gradient -->
    <linearGradient id="sideRingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#FBBF24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Subtle Dither Pattern -->
    <pattern id="sideDither" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="1" fill="#30363D" opacity="0.35"/>
      <rect x="2" y="2" width="1" height="1" fill="#30363D" opacity="0.35"/>
    </pattern>

    <style>
      @keyframes twinkle1 {
        0%, 100% { opacity: 0.25; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      @keyframes twinkle2 {
        0%, 100% { opacity: 0.85; transform: scale(1.1); }
        50% { opacity: 0.2; transform: scale(0.8); }
      }
      @keyframes twinkle3 {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      .star { transform-box: fill-box; transform-origin: center; }
      .s1 { animation: twinkle1 2.5s ease-in-out infinite; }
      .s2 { animation: twinkle2 3.2s ease-in-out infinite 0.6s; }
      .s3 { animation: twinkle3 3.8s ease-in-out infinite 1.2s; }
    </style>
  </defs>

  <!-- Clipped Card Content -->
  <g clip-path="url(#cardClip)">
    <!-- 1. Background -->
    <rect width="220" height="220" fill="#0A0D12"/>

    <!-- Subtle Dither Sky Pattern -->
    <rect y="0" width="220" height="130" fill="url(#sideDither)"/>

    <!-- Ambient Sky Glow -->
    <circle cx="160" cy="140" r="75" fill="url(#sideSkyGlow)"/>

    <!-- Distant Cosmic Crescent / Eclipse in Sky -->
    <g transform="translate(160, 48)" opacity="0.9">
      <circle cx="0" cy="0" r="10" fill="#0A0D12" stroke="#F59E0B" stroke-width="0.7"/>
      <ellipse cx="0" cy="0" rx="22" ry="2" fill="none" stroke="url(#sideRingGrad)" stroke-width="1"/>
      <circle cx="0" cy="0" r="10.5" fill="none" stroke="#FBBF24" stroke-width="0.5" opacity="0.9"/>
    </g>

    <!-- Starry Sky with Twinkling Keyframes Only -->
    <g id="stars">
      <rect x="25" y="35" width="2" height="2" fill="#F0F6FC" class="star s1"/>
      <g transform="translate(50, 52)" class="star s2">
        <rect x="1" y="0" width="1" height="3" fill="#FBBF24"/>
        <rect x="0" y="1" width="3" height="1" fill="#FBBF24"/>
      </g>
      <rect x="85" y="30" width="1.5" height="1.5" fill="#F59E0B" class="star s3"/>
      <rect x="115" y="45" width="2" height="2" fill="#F0F6FC" class="star s1"/>
      <g transform="translate(195, 30)" class="star s2">
        <rect x="1" y="0" width="1" height="3" fill="#FBBF24"/>
        <rect x="0" y="1" width="3" height="1" fill="#FBBF24"/>
      </g>
      <rect x="180" y="65" width="1.5" height="1.5" fill="#F59E0B" class="star s3"/>
      <rect x="35" y="85" width="1.5" height="1.5" fill="#F0F6FC" class="star s1"/>
      <rect x="68" y="78" width="1.5" height="1.5" fill="#FBBF24" class="star s2"/>
      <rect x="125" y="70" width="1.5" height="1.5" fill="#F0F6FC" class="star s3"/>
      <rect x="190" y="95" width="1.5" height="1.5" fill="#F59E0B" class="star s1"/>
    </g>

    <!-- Background Mountain Ridge -->
    <polygon points="
      0,155
      35,145
      72,135
      96,142
      130,130
      165,140
      195,132
      220,138
      220,220
      0,220
    " fill="#0D1117"/>
    <polyline points="
      0,155
      35,145
      72,135
      96,142
      130,130
      165,140
      195,132
      220,138
    " fill="none" stroke="#161B22" stroke-width="1"/>

    <!-- Foreground Terrain Ridge -->
    <polygon points="
      0,172
      28,169
      62,163
      94,159
      125,161
      160,156
      190,161
      220,158
      220,220
      0,220
    " fill="#161B22"/>
    <polyline points="
      0,172
      28,169
      62,163
      94,159
      125,161
      160,156
      190,161
      220,158
    " fill="none" stroke="#30363D" stroke-width="1.2"/>

    <!-- Ground Dither Stipples -->
    <g fill="#0A0D12" opacity="0.7">
      <rect x="0" y="188" width="220" height="32"/>
      <rect x="8" y="176" width="2" height="2"/>
      <rect x="22" y="179" width="2" height="2"/>
      <rect x="45" y="174" width="2" height="2"/>
      <rect x="76" y="177" width="2" height="2"/>
      <rect x="104" y="173" width="2" height="2"/>
      <rect x="135" y="176" width="2" height="2"/>
      <rect x="172" y="172" width="2" height="2"/>
      <rect x="200" y="175" width="2" height="2"/>
    </g>

    <!-- Minimalist Trekker / Astronaut Silhouette (Looking Right) -->
    <g id="pixel-trekker" transform="translate(62, 116)">
      <!-- Antenna / Beacon -->
      <rect x="9" y="0" width="1.5" height="3" fill="#30363D"/>
      <rect x="8" y="0" width="3" height="1.5" fill="#FBBF24"/>

      <!-- Helmet -->
      <rect x="5" y="3" width="9" height="9" rx="1.5" fill="#30363D"/>
      <!-- Visor (Glowing Amber reflection) -->
      <rect x="10" y="4.5" width="4.5" height="4.5" rx="1" fill="#F59E0B"/>
      <rect x="11.5" y="5.2" width="2.2" height="2.2" fill="#FBBF24"/>
      <rect x="13" y="5.2" width="0.8" height="0.8" fill="#F0F6FC"/>

      <!-- Trekker Backpack -->
      <rect x="0.5" y="12" width="5.5" height="14" rx="1" fill="#0D1117"/>
      <rect x="2" y="14" width="2.5" height="3" fill="#30363D"/>
      <rect x="2" y="20" width="2.5" height="2.5" fill="#F59E0B" opacity="0.9"/>

      <!-- Torso / Suit -->
      <rect x="6" y="12" width="8.5" height="15" fill="#0D1117"/>
      <rect x="8" y="13.5" width="5.5" height="6" fill="#161B22"/>
      <rect x="9.5" y="15" width="1.5" height="1.5" fill="#FBBF24"/>

      <!-- Arms -->
      <rect x="14" y="13.5" width="3" height="10" fill="#161B22"/>
      <rect x="15" y="23.5" width="2" height="2" fill="#30363D"/>
      <rect x="4.5" y="13.5" width="2.5" height="9" fill="#0A0D12"/>

      <!-- Trekking Pole -->
      <line x1="16.5" y1="21" x2="19" y2="48" stroke="#30363D" stroke-width="1"/>
      <line x1="15" y1="21" x2="18" y2="21" stroke="#F59E0B" stroke-width="1.2"/>

      <!-- Legs -->
      <rect x="6" y="27" width="4" height="14" fill="#0D1117"/>
      <rect x="5" y="41" width="5" height="6" fill="#0A0D12"/>
      <rect x="4" y="47" width="6" height="2" fill="#30363D"/>

      <rect x="10.5" y="27" width="4" height="14" fill="#161B22"/>
      <rect x="10.5" y="41" width="5" height="6" fill="#0D1117"/>
      <rect x="10.5" y="47" width="6" height="2" fill="#30363D"/>
    </g>

    <!-- Minimalist Pixel Sunflower (Facing Trekker) -->
    <g id="pixel-sunflower" transform="translate(150, 110) scale(1.35)">
      <!-- Soft Amber Bloom -->
      <circle cx="10" cy="10" r="14" fill="#FBBF24" opacity="0.18"/>

      <!-- Roots -->
      <rect x="7" y="36" width="6" height="2" fill="#0D1117"/>

      <!-- Stem -->
      <rect x="9" y="16" width="2" height="21" fill="#78350F"/>

      <!-- Leaves -->
      <rect x="4" y="24" width="5" height="3" rx="1" fill="#B45309"/>
      <rect x="3" y="25" width="2" height="2" fill="#78350F"/>
      <rect x="11" y="20" width="5" height="3" rx="1" fill="#B45309"/>
      <rect x="15" y="21" width="2" height="2" fill="#78350F"/>

      <!-- Petal Ring -->
      <rect x="8" y="2" width="4" height="4" fill="#FBBF24"/>
      <rect x="8" y="14" width="4" height="4" fill="#FBBF24"/>
      <rect x="2" y="8" width="4" height="4" fill="#FBBF24"/>
      <rect x="14" y="8" width="4" height="4" fill="#FBBF24"/>

      <!-- Diagonals -->
      <rect x="4" y="4" width="4" height="4" fill="#F59E0B"/>
      <rect x="12" y="4" width="4" height="4" fill="#F59E0B"/>
      <rect x="4" y="12" width="4" height="4" fill="#F59E0B"/>
      <rect x="12" y="12" width="4" height="4" fill="#F59E0B"/>

      <!-- Inner Corona -->
      <rect x="7" y="5" width="6" height="2" fill="#FBBF24"/>
      <rect x="7" y="13" width="6" height="2" fill="#FBBF24"/>
      <rect x="5" y="7" width="2" height="6" fill="#FBBF24"/>
      <rect x="13" y="7" width="2" height="6" fill="#FBBF24"/>

      <!-- Disc Core -->
      <rect x="7" y="7" width="6" height="6" fill="#0A0D12"/>
      <rect x="8" y="8" width="4" height="4" fill="#78350F"/>
      <rect x="9" y="9" width="2" height="2" fill="#FBBF24"/>
    </g>

    <!-- Floating Pollen Embers -->
    <circle cx="138" cy="128" r="1.2" fill="#FBBF24" opacity="0.8"/>
    <circle cx="128" cy="138" r="1.0" fill="#F59E0B" opacity="0.6"/>
    <circle cx="150" cy="116" r="1.2" fill="#FBBF24" opacity="0.9"/>
    <circle cx="118" cy="122" r="0.8" fill="#FBBF24" opacity="0.7"/>
    <circle cx="144" cy="106" r="1.0" fill="#F59E0B" opacity="0.5"/>
  </g>

  <!-- 2. Outer Border (1.5px in #30363D with rx=18 ry=18) -->
  <rect x="0.75" y="0.75" width="218.5" height="218.5" rx="18" ry="18" fill="none" stroke="#30363D" stroke-width="1.5"/>
</svg>
