name: Generate Snake Contribution Heatmap

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate github-snake-yellow.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Veditha08
          outputs: |
            dist/github-snake-yellow.svg?palette=github-dark&color_snake=#FBBF24&color_dots=#161B22,#451A03,#78350F,#D97706,#FBBF24

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

